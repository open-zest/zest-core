site_name: Project ZeST
site_url: https://open-zest.web.app
repo_url: https://github.com/open-zest/zest-core
repo_name: open-zest/zest-core

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.sections

plugins:
  - search

draft_docs: |
  drafts/

nav:
  - Home: index.md
  - Architecture:
      - architecture/index.md
      - Data-Precedes-Physical Spec: architecture/data-precedes-physical.md
  - Maps:
      - maps/index.md
      - European & UK Corridor Reference: maps/corridor-reference-map.md
  - Methodology:
      - methodology/index.md
      - Discrete-Event Simulation (SimPy): methodology/discrete-event-simulation.md
  - Policy:
      - policy/index.md
      - EU eFTI FTI004 Submission: policy/eu-efti-fti004.md
  - Series:
      - Overview: series/index.md
      - "Part 1: The Data Timing Problem": series/s01/01-data-timing-problem.md
      - "Part 2: The Suez-to-Gibraltar Arc": series/s01/02-suez-gibraltar-arc.md
