[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-zest"
version = "0.1.0"
description = "Open Zero-Sorting Terminal (ZeST) Discrete-Event Simulation & Dispatch Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Open-ZeST Working Group" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0.0",
    "simpy>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["schemas*", "solvers*"]
