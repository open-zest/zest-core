[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zest-core"
version = "0.1.0"
description = "Core simulation, stowage optimization, and rail milk-run DES engine for Project Open-ZeST"
readme = "README.md"
authors = [
    { name = "James P. Reefe", email = "jamespr615@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "simpy>=4.0.1",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["schemas*", "solvers*"]
